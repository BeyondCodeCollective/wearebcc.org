  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head><style data-dc-design-system-vars=\"\">@layer{:root{--bcc-true-black:#000000;--bcc-cream:#fffdf7;--bcc-cream-warm:#fef9ed;--bcc-off-white:#fffafa;--bcc-white:#ffffff;--bcc-cobalt:#0048ff;--bcc-dark-cobalt:#012966;--bcc-cobalt-tint:#1d59ff;--bcc-sky:#a8dbff;--bcc-crimson:#570000;--bcc-red-warning:#ff0000;--bcc-red-warm:#ca4c3b;--bcc-lemon:#e5f701;--bcc-forest:#193f0f;--bcc-orange:#ff4c00;--bcc-orange-2:#ff4901;--bcc-peach:#ffe3d7;--bcc-peach-soft:#ffcbb5;--bcc-gray-900:#181818;--bcc-gray-850:#1c1a1a;--bcc-gray-800:#1e1e1e;--bcc-gray-700:#2d2d2d;--bcc-gray-600:#393939;--bcc-gray-500:#646464;--bcc-gray-400:#6b6b6b;--bcc-gray-300:#949494;--bcc-gray-250:#989898;--bcc-gray-200:#d8d8d8;--bcc-gray-100:#ececec;--fg1:#000000;--fg2:#2d2d2d;--fg3:#6b6b6b;--fg-inverse:#fffdf7;--fg-accent:#0048ff;--fg-warning:#ff0000;--bg-paper:#fffdf7;--bg-paper-warm:#fef9ed;--bg-ink:#000000;--bg-ink-2:#181818;--bg-card:#ffffff;--bg-muted:#ececec;--bg-cobalt:#0048ff;--bg-dark-cobalt:#012966;--bg-lemon:#e5f701;--bg-forest:#193f0f;--bg-crimson:#570000;--stroke-strong:#000000;--stroke-medium:#2d2d2d;--stroke-soft:#d8d8d8;--stroke-hairline:#949494;--shadow-inset-soft:inset 0 4px 4px 0 rgba(0,0,0,0.25);--shadow-card:0 1px 0 0 rgba(0,0,0,0.08);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:40px;--space-8:56px;--space-9:80px;--space-10:120px;--radius-0:0px;--radius-xs:2px;--radius-sm:4px;--radius-md:12px;--radius-lg:20px;--radius-xl:32px;--font-display:\"Special Gothic Condensed\", \"Arial Narrow\", sans-serif;--font-sans:\"GT Standard\", \"Helvetica Neue\", Arial, sans-serif;--font-mono:\"GT Standard Mono\", \"Menlo\", \"Courier New\", monospace;--text-display-xl:700 148px/0.88 var(--font-display);--text-display-lg:700 96px/0.85 var(--font-display);--text-display-md:700 88px/1.18 var(--font-display);--text-display-sm:700 48px/1 var(--font-display);--text-title:700 30px/26px var(--font-display);--text-body-lg:400 20px/1.4 var(--font-sans);--text-body:400 16px/1.45 var(--font-sans);--text-body-sm:400 14px/1.45 var(--font-sans);--text-mono-lg:500 34px/1.08 var(--font-mono);--text-mono:500 18px/1.08 var(--font-mono);--text-mono-sm:500 14px/1.1 var(--font-mono);}}<\u002Fstyle>\n<meta charset=\"utf-8\">\n<title>Six Month Impact Report — Beyond Code Collective<\u002Ftitle>\n<script src=\"d269fa74-606c-4456-951e-e2d50b9cd3c7\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1440\"><meta name=\"hz:canvas-height\" content=\"2600\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n@font-face{font-family:'GT Standard';src:url(\"9c130923-9dc8-4736-8eec-b018ce480eac\") format('woff2');font-weight:400}\n@font-face{font-family:'GT Standard Mono';src:url(\"7cdb9e0b-e6ec-4a33-ba65-5ee87ca96060\") format('woff2');font-weight:500}\n@font-face{font-family:'Special Gothic Condensed';src:url(\"e1aa151f-d5f5-4e98-a40c-b0fdfd0ed4bf\") format('truetype');font-weight:700}\nbody{margin:0}\na{color:inherit}a:hover{opacity:.85}\ninput:focus{outline:2px solid currentColor;outline-offset:2px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: {{p.ground}}; color: {{p.ink}}; font-family: 'GT Standard', 'Helvetica Neue', Arial, sans-serif;\" data-canvas-width=\"1440\" data-canvas-height=\"2600\" data-document-role=\"page\" data-label=\"Landing page\">\n\n  <header style=\"background: {{p.heroBg}}; color: {{p.heroFg}};\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 28px 40px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;\">\n      <img src=\"{{p.logo}}\" alt=\"Beyond Code Collective\" style=\"width: 300px; height: 24px; object-fit: contain; object-position: left center;\">\n      <p style=\"margin: 0; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: {{p.eyebrow}};\">[Six Month Impact Report · Fall 2026]<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"background: {{p.heroBg}}; color: {{p.heroFg}};\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 48px 40px 88px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start;\">\n      <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px;\">\n        <p style=\"margin: 0; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: {{p.eyebrow}};\">[TL;DR]<\u002Fp>\n        <h1 style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: clamp(64px, 9vw, 132px); line-height: 0.88; letter-spacing: -0.02em; text-transform: uppercase;\">Six months in, the model holds.<\u002Fh1>\n        <p style=\"margin: 0; max-width: 640px; font-size: 21px; line-height: 1.45;\">Beyond Code Collective™ is a place-based nonprofit building intergenerational opportunity in the technologies of today and tomorrow. We launched in March 2026. In our first six months, 485 learners came through our Atlanta Center and Catalyst workforce programs, across six generations and 16 U.S. states and territories.<\u002Fp>\n        <p style=\"margin: 0; max-width: 640px; font-size: 21px; line-height: 1.45;\">People show up. They stay. They teach each other. This report is their story, told with real numbers and real names.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 380px; min-width: 0; max-width: 460px; display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"background: {{p.card}}; color: {{p.ink}}; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 20px;\">\n          <sc-if value=\"{{notSent}}\" hint-placeholder-val=\"{{ true }}\">\n            <form sc-camel-on-submit=\"{{submit}}\" style=\"display: flex; flex-direction: column; gap: 16px;\">\n              <p style=\"margin: 0; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: {{p.label}};\">[Read the report]<\u002Fp>\n              <h2 style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 40px; line-height: 0.95; text-transform: uppercase;\">See the full report.<\u002Fh2>\n              <label for=\"fn\" style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px;\">First name\n                <input id=\"fn\" name=\"firstName\" type=\"text\" autocomplete=\"given-name\" required=\"\" placeholder=\"Jordan\" style=\"height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #2d2d2d; border-radius: 4px; background: #ffffff; font: inherit; font-size: 17px; color: #1c1a1a;\">\n              <\u002Flabel>\n              <label for=\"em\" style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px;\">Email\n                <input id=\"em\" name=\"email\" type=\"email\" autocomplete=\"email\" required=\"\" placeholder=\"jordan@example.org\" style=\"height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #2d2d2d; border-radius: 4px; background: #ffffff; font: inherit; font-size: 17px; color: #1c1a1a;\">\n              <\u002Flabel>\n              <label for=\"org\" style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px;\">Organization\n                <input id=\"org\" name=\"organization\" type=\"text\" autocomplete=\"organization\" placeholder=\"Your organization\" style=\"height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #2d2d2d; border-radius: 4px; background: #ffffff; font: inherit; font-size: 17px; color: #1c1a1a;\">\n              <\u002Flabel>\n              <button type=\"submit\" style=\"height: 52px; margin-top: 4px; border: 0; border-radius: 2px; background: {{p.btnBg}}; color: {{p.btnFg}}; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;\">View the report<\u002Fbutton>\n              <p style=\"margin: 0; font-size: 13px; line-height: 1.45; color: #4a4a4a;\">Share a few details and the report opens right away. We’ll also send occasional updates from Beyond Code. Unsubscribe anytime.<\u002Fp>\n            <\u002Fform>\n          <\u002Fsc-if>\n          <sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 14px; min-height: 360px; justify-content: center;\">\n              <p style=\"margin: 0; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: {{p.label}};\">[Thanks for reading]<\u002Fp>\n              <h2 style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 44px; line-height: 0.95; text-transform: uppercase;\">Your report is open.<\u002Fh2>\n              <p style=\"margin: 0; font-size: 17px; line-height: 1.45;\">The Six Month Impact Report opened in a new tab. Pass it along to anyone who should see it.<\u002Fp>\n              <a href=\"/_blob/6ed468376e81514527fa681922a87f92\" target=\"_blank\" rel=\"noopener\" style=\"align-self: flex-start; display: inline-flex; align-items: center; height: 48px; padding: 0 20px; border-radius: 2px; background: {{p.btnBg}}; color: {{p.btnFg}}; text-decoration: none; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase;\">Open the report again<\u002Fa>\n              <button type=\"button\" sc-camel-on-click=\"{{reset}}\" style=\"align-self: flex-start; height: 44px; padding: 0 16px; border: 1px solid #2d2d2d; border-radius: 2px; background: transparent; color: inherit; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 14px; text-transform: uppercase; cursor: pointer;\">Back to form<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1280px; margin: 0 auto; padding: 80px 40px 40px;\">\n    <p style=\"margin: 0 0 24px; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: {{p.label}};\">[By the numbers]<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 20px; border-top: 3px solid {{p.rule}};\">\n        <p style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 88px; line-height: 0.9; color: {{p.stat}};\">485<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.4;\">learners served across our Atlanta Center and Catalyst programs<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 20px; border-top: 3px solid {{p.rule}};\">\n        <p style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 88px; line-height: 0.9; color: {{p.stat}};\">80%<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.4;\">of Center learners reported more confidence with technology<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 20px; border-top: 3px solid {{p.rule}};\">\n        <p style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 88px; line-height: 0.9; color: {{p.stat}};\">100%<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.4;\">of Center learners taught what they learned to someone else<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 20px; border-top: 3px solid {{p.rule}};\">\n        <p style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 88px; line-height: 0.9; color: {{p.stat}};\">2.3M<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.4;\">views of Code Along Beyond: Music in its first month<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width: 1280px; margin: 0 auto; padding: 56px 40px 80px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center;\">\n    <img src=\"ef0c969c-2655-482f-97d1-280ed1c95242\" alt=\"A builder working at her desk in a creative studio\" style=\"flex: 1 1 360px; min-width: 0; height: 520px; object-fit: cover; object-position: center 30%; border-radius: 20px;\">\n    <div style=\"flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 22px;\">\n      <p style=\"margin: 0; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: {{p.label}};\">[Inside the report]<\u002Fp>\n      <h2 style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: clamp(44px, 5vw, 64px); line-height: 0.92; text-transform: uppercase;\">A young organization’s honest ledger.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px 32px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid #949494;\">\n          <p style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase;\">Learner outcomes<\u002Fp>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.45;\">Confidence, belonging and career self-belief, from pre- and post-program surveys.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid #949494;\">\n          <p style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase;\">Who we serve<\u002Fp>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.45;\">Six generations in the room, from under 18 to 45+, and where they’re starting from.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid #949494;\">\n          <p style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase;\">Partnership highlights<\u002Fp>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.45;\">Spotlights on our work with the City of Atlanta Department of Labor and NextEra Energy.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid #949494;\">\n          <p style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase;\">What’s next<\u002Fp>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.45;\">Field Ready, our next workforce track, and more Beyond Code Centers coast to coast.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: {{p.ctaBg}}; color: {{p.ctaFg}};\">\n    <div style=\"max-width: 1280px; margin: 0 auto; padding: 96px 40px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-end; justify-content: space-between;\">\n      <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px;\">\n        <p style=\"margin: 0; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase;\">[Build with us]<\u002Fp>\n        <h2 style=\"margin: 0; font-family: 'Special Gothic Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: clamp(52px, 7vw, 104px); line-height: 0.88; text-transform: uppercase;\">The future belongs to all of us.<\u002Fh2>\n        <p style=\"margin: 0; max-width: 620px; font-size: 20px; line-height: 1.45;\">Bring a Beyond Code Center to your city, support Catalyst learners, or build something with our team. Reach out to learn more.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"mailto:partnerships@wearebcc.org?subject=Beyond%20Code%20Impact%20Report\" style=\"flex: 0 0 auto; display: inline-flex; align-items: center; height: 60px; padding: 0 28px; border-radius: 2px; background: {{p.ctaBtnBg}}; color: {{p.ctaBtnFg}}; text-decoration: none; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 18px; letter-spacing: 0.02em;\">partnerships@wearebcc.org<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width: 1280px; margin: 0 auto; padding: 28px 40px 40px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; font-family: 'GT Standard Mono', Menlo, monospace; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #5e5e5e;\">\n    <span>Beyond Code Collective™ · Impact Report 2026<\u002Fspan>\n    <span>wearebcc.org<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Forest + Lemon&quot;,&quot;Crimson + Peach&quot;,&quot;Peach + Orange&quot;],&quot;default&quot;:&quot;Forest + Lemon&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2600}}\">\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { sent: false }; }\n  renderVals() {\n    const P = {\n      'Forest + Lemon': { ground: '#FEF9ED', heroBg: '#193F0F', heroFg: '#FFFDF7', eyebrow: '#E5F701', noteFg: '#E9F0D8', card: '#FFFDF7', ink: '#1C1A1A', label: '#193F0F', btnBg: '#E5F701', btnFg: '#193F0F', stat: '#193F0F', rule: '#E5F701', ctaBg: '#E5F701', ctaFg: '#193F0F', ctaBtnBg: '#193F0F', ctaBtnFg: '#E5F701', logo: '/_blob/eb5b09721d7fed39844e036a040ff398' },\n      'Crimson + Peach': { ground: '#FFF6F1', heroBg: '#570000', heroFg: '#FFFDF7', eyebrow: '#FFCBB5', noteFg: '#FFE3D7', card: '#FFFDF7', ink: '#1C1A1A', label: '#570000', btnBg: '#570000', btnFg: '#FFFDF7', stat: '#570000', rule: '#CA4C3B', ctaBg: '#FFCBB5', ctaFg: '#570000', ctaBtnBg: '#570000', ctaBtnFg: '#FFE3D7', logo: '/_blob/eb5b09721d7fed39844e036a040ff398' },\n      'Peach + Orange': { ground: '#FFFDF7', heroBg: '#FFE3D7', heroFg: '#3A0A00', eyebrow: '#570000', noteFg: '#570000', card: '#FFFDF7', ink: '#1C1A1A', label: '#570000', btnBg: '#FF4C00', btnFg: '#1C1A1A', stat: '#570000', rule: '#FF4C00', ctaBg: '#FF4C00', ctaFg: '#1C1A1A', ctaBtnBg: '#1C1A1A', ctaBtnFg: '#FFE3D7', logo: '/_blob/7ecd70b7127e45deaf1e57c55d822019' }\n    };\n    const p = P[this.props.palette ?? 'Forest + Lemon'] || P['Forest + Lemon'];\n    return {\n      p,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); try { window.open('/_blob/6ed468376e81514527fa681922a87f92', '_blank', 'noopener'); } catch (err) {} },\n      reset: () => this.setState({ sent: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
