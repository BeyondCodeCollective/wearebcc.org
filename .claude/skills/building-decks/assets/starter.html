<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck title</title>
<style>
/* ---------------------------------------------------------------------------
   FONTS — base64 the real brand faces here. Convert OTF/TTF to woff2 first.
   @font-face{font-family:'Head';src:url(data:font/woff2;base64,…) format('woff2');
              font-weight:900;font-display:block}
   --------------------------------------------------------------------------- */

:root{
  --accent:#1D59FF; --accent2:#E5F701; --wht:#FFFFFF; --blk:#000000;
  --head:'Head',Impact,sans-serif; --body:'Body',system-ui,sans-serif;
  --mono:'Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}  /* iOS inflates text without this */
html,body{height:100%}
body{background:var(--blk);font-family:var(--body);color:var(--blk);overflow:hidden}

/* --- PROJECTOR MODE ------------------------------------------------------- */
.deck{height:100vh;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.slide{height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;
  position:relative;isolation:isolate;      /* contains inner z-index; keeps chrome on top */
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(1.4rem,4.4vw,4.4rem);padding-bottom:clamp(3.6rem,9vh,5.4rem)}
.s-light{background:var(--wht);color:var(--blk)}
.s-dark {background:var(--blk);color:var(--wht)}
.s-accent{background:var(--accent);color:var(--wht)}

/* --- TYPE — projector first. Nothing below 14px, anywhere. ---------------- */
.kick{display:inline-block;font-family:var(--mono);font-weight:700;
  font-size:clamp(1rem,1.2vw,1.35rem);letter-spacing:.16em;text-transform:uppercase;
  opacity:.65;margin-bottom:clamp(.6rem,1.8vh,1.1rem)}
.kick::before{content:"[ "}.kick::after{content:" ]"}
h1{font-family:var(--head);font-size:clamp(2.2rem,5.4vw,5rem);line-height:1.02;letter-spacing:-.02em}
h2{font-family:var(--head);font-size:clamp(1.9rem,4.4vw,4rem);line-height:1.03;letter-spacing:-.02em;
  margin-bottom:clamp(.8rem,2.4vh,1.6rem)}
p.lede{font-size:clamp(1.2rem,1.72vw,2rem);line-height:1.45;max-width:40ch}
.acc{color:var(--accent2)}

/* --- CHROME --------------------------------------------------------------- */
.foot{display:none}                          /* becomes the section header on mobile */
.deckfoot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--blk);color:var(--accent2);
  font-family:var(--mono);font-weight:700;font-size:clamp(.95rem,1.05vw,1.15rem);letter-spacing:.14em;
  text-transform:uppercase;padding:clamp(.55rem,1.5vh,.9rem) clamp(1.4rem,4.4vw,4.4rem);
  display:flex;justify-content:space-between;gap:1rem}
.dots{position:fixed;right:clamp(.5rem,1.6vw,1.2rem);top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:.5rem;z-index:50}
.dots button{width:9px;height:9px;border:0;padding:0;background:rgba(128,128,128,.5);border-radius:2px;cursor:pointer}
.dots button.act{background:var(--accent2);transform:scale(1.3)}
.note{display:none}                          /* speaker notes travel in the file */
body.notes-on .note{display:block;position:absolute;left:0;right:0;bottom:3.5rem;z-index:9;
  background:rgba(0,0,0,.9);color:#fff;font-size:14px;padding:1rem}

/* --- REVEAL --------------------------------------------------------------- */
.slide>*:not(.foot){opacity:0;transform:translateY(14px)}
.slide.on>*:not(.foot){opacity:1;transform:none;transition:opacity .55s ease,transform .55s ease}
.slide.on>*:nth-child(2){transition-delay:.05s}
.slide.on>*:nth-child(3){transition-delay:.12s}
@media (prefers-reduced-motion:reduce){
  .slide>*{opacity:1!important;transform:none!important;transition:none!important}}

/* --- SHORT VIEWPORTS (1280x720 projectors) -------------------------------- */
@media (min-width:821px) and (max-height:820px){
  h1{font-size:clamp(2rem,4.6vw,3.6rem)}h2{font-size:clamp(1.7rem,3.4vw,2.7rem)}
}

/* ===========================================================================
   MOBILE — a document, not a deck. MUST STAY LAST IN THIS STYLESHEET.
   Many of these tie on specificity with the rules above; source order is what
   makes them win. Moving this block up silently breaks slides.
   Four rules: one gutter, one rhythm, one scale, no desktop chrome.
   =========================================================================== */
@media (max-width:820px){
  :root{--g:22px;--sp:1.5rem;--sp-lg:2.4rem}

  html,body{height:auto;overflow:visible}
  .deck{height:auto;min-height:0;overflow:visible;scroll-snap-type:none}
  .slide{height:auto;min-height:0;overflow:visible;scroll-snap-align:none;
    display:flex;flex-direction:column;justify-content:flex-start;
    padding:var(--sp-lg) var(--g)}
  .dots,.deckfoot{display:none}
  .slide+.slide{border-top:3px solid rgba(128,128,128,.3)}

  /* one gutter */
  .slide>*,.slide .row>*{max-width:100%!important;margin-left:0;margin-right:0}
  .row,.split,.grid{display:block!important}
  /* one rhythm */
  .slide>*+*{margin-top:var(--sp)}
  /* one scale */
  h1{font-size:2.35rem;line-height:1.02}
  h2{font-size:1.95rem;line-height:1.04;margin-bottom:0}
  .kick{font-size:.8125rem;margin-bottom:0}
  p.lede{font-size:1.0625rem;max-width:none}
  /* no desktop chrome */
  .sq,.bracket,.bezel{display:none!important}

  /* section wayfinding from markup that already exists.
     Show ONLY the number — the kicker already names the section, and showing
     both prints every title twice. */
  .foot{display:flex;order:-1;margin:0 0 calc(var(--sp) * .6);gap:.8rem;align-items:baseline;
    font-family:var(--mono);font-weight:700;text-transform:uppercase;
    font-size:.8125rem;letter-spacing:.14em}
  .foot span:first-child{display:none}
  .foot span:last-child{color:var(--accent2);opacity:.85}
  .deck>.slide:first-child .foot{display:none}
}
</style></head>
<body>
<div class="deck" id="deck">

  <section class="slide s-accent">
    <span class="kick">Kicker</span>
    <h1>The opening line,<br><span class="acc">in two tones.</span></h1>
    <p class="lede">One supporting sentence.</p>
    <div class="note"><b>Speaker</b> Denominators, citations, permissions, anything cut for space.</div>
    <div class="foot"><span>Section label</span><span>01</span></div>
  </section>

  <section class="slide s-light">
    <span class="kick">Second section</span>
    <h2>A statement worth <span class="acc">its own slide</span></h2>
    <p class="lede">Keep body copy above 21px at 1920. People sit at the back.</p>
    <div class="foot"><span>Second section</span><span>02</span></div>
  </section>

</div>
<div class="dots" id="dots"></div>
<div class="deckfoot" id="deckfoot"></div>
<script>
const slides = [...document.querySelectorAll('.slide')];
const dotsEl = document.getElementById('dots');
const deckfoot = document.getElementById('deckfoot');
slides.forEach(s => { const b = document.createElement('button');
  b.onclick = () => s.scrollIntoView(); dotsEl.appendChild(b); });
const dots = [...dotsEl.children];

// One observer: marks the active slide, drives the dots, feeds the footer.
// .on is added once and never removed, so reveals do not replay on scroll-back.
const io = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('on');
  const i = slides.indexOf(e.target);
  dots.forEach((b, j) => b.classList.toggle('act', j === i));
  const f = e.target.querySelector('.foot');
  deckfoot.innerHTML = f ? f.innerHTML : '';
}), { threshold: .5 });
slides.forEach(s => io.observe(s));

addEventListener('keydown', e => {
  const cur = slides.findIndex(s => s.getBoundingClientRect().top >= -50);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); slides[cur + 1]?.scrollIntoView(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); slides[cur - 1]?.scrollIntoView(); }
  if (e.key === 'n') document.body.classList.toggle('notes-on');   // speaker notes
});
</script>
</body></html>
